<body>
    <h1>Mostrar informacion</h1>
    <button onClick="cargar_informacion()">Cargar información</button>

    
    <table border="1" id="tabla">

    </table>

    <script>

        let datos = ["usuario", "password", "john", 123, "jane", 456, 789]
        let cadena = "<tr>"
        let contador = 1
    
        

        function cargar_informacion(){
            let tabla = document.getElementById("tabla")

            for (const key in datos) {
                const element = datos[key];
                cadena += "<td>" + element + "</td>"

                if (contador == 2) {
                    cadena += "</tr><tr>"
                    contador = 0
                }

                contador += 1
            }

            tabla.innerHTML = cadena
            //tabla.innerHTML= "hola"
        }
    </script>
